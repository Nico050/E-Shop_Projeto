{% extends "sitecompras/base.html" %}
{% load bootstrap3 %}

{% block header %}
    <h2>Faça seu cadastro.</h2>
{% endblock header %}

{% block content %}
    <form action="{% url 'register' %}" method="post" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}

        {% buttons %}
            <button type="submit" class="btn btn-primary">Registrar</button>
        {% endbuttons %}
        <input type="hidden" name="next" value="{% url 'index' %}">
    </form>
{% endblock content %}
