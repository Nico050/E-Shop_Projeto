{% extends "sitecompras/base.html" %}

{% block content %}
    {% for produto in produtos %}
        <hr>
        <a href="{% url 'produto_page' produto.id %}"><img src="{{ produto.photo.url }}" style="max-width: 200px;"></a>
        <li>
            {{ produto.name }}
            <p>R$ {{ produto.price }}</p>
        </li>
    {% endfor %}
{% endblock content %}
