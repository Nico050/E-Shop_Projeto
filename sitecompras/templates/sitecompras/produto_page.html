{% extends "sitecompras/base.html" %}

{% block content %}
    <p>{{ produto.photo }}</p>
    <p>{{ produto.name }}</p>
    <p>R$ {{ produto.price }}</p>
    <p>{{ produto.description }}</p>

    <form action="{% url 'add_cart' produto.id %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <label for="quantity">Quantidade:</label>
        <input type="number" name="quantity" value="1" min="1" max="999">
        <button type="submit">Adicionar ao carrinho</button>
    </form>

{% endblock content %}
